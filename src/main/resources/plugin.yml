name: PowerSMP
version: '${project.version}'
main: com.powersmp.PowerSMP
api-version: '1.21'
authors: [PowerSMP]
description: Bespoke per-player power kits.
folia-supported: false
# ProtocolLib: real Mirage clones (falls back to armour stands without it).
# LuckPerms:   must load first so powersmp.use / powersmp.admin resolve.
# The rest are plugins known to be on this server whose behaviour overlaps
# PowerSMP's; listing them only fixes load order, not the conflicts. See
# COMPATIBILITY.md -- NoCheatPlus and the lag clearers need real config work.
softdepend: [ProtocolLib, LuckPerms, NoCheatPlus, ClearLag, LaggRemover, LaggRemoverPlus]

commands:
  stance:
    description: Change your combat stance (kits that support stances only).
    usage: /stance <red|blue|green|none>
    permission: powersmp.use
  power:
    description: List and activate the abilities of your kit.
    usage: /power [list|use <ability>|info]
    aliases: [powers, ability]
    permission: powersmp.use
  xp:
    # NOTE: this shadows vanilla /xp (an alias of /experience) for unqualified use.
    # Vanilla remains reachable as /minecraft:xp; this one as /powersmp:xp.
    description: Fill your inventory with experience bottles (TechKnightGaming).
    usage: /xp
    aliases: [xpbottles]
    permission: powersmp.use
  kill:
    # Shadows vanilla /kill. Anyone who is not KornFlakis is forwarded to
    # minecraft:kill under their own permissions, so ops keep the real
    # command; /minecraft:kill also always works.
    description: Execute a player (KornFlakis), or the vanilla /kill for everyone else.
    usage: /kill <player>
    permission: powersmp.use
  powersmp:
    description: PowerSMP administration.
    usage: /powersmp <reload|info [player]|grant <player> <power>|revoke <player> <power>|kills <player> [amount]|spear [player]>
    aliases: [psmp]
    permission: powersmp.admin

permissions:
  powersmp.use:
    description: Use your assigned kit's commands.
    default: true
  powersmp.admin:
    description: Administrate PowerSMP.
    default: op

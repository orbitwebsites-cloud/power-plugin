# =====================================================================
# PowerSMP tuning config
# ---------------------------------------------------------------------
# Every number the build spec left open lives here so it can be changed
# without recompiling. Values marked  # ASSUMED  are guesses made during
# the build because the spec said "needs a number from <player>".
# Reload with /powersmp reload.
# =====================================================================

general:
  # How often (in ticks) the per-player kit tick runs -- every online player's kit.tick() fires
  # once per this many ticks. 20 = once a second, which is what the spec originally asked for
  # ("polled ~1x/sec"). Raised to 40 (once every 2s) for headroom on constrained hardware: this is
  # the main per-player, per-kit recurring cost in the plugin (passive buff refreshes, restock/xray
  # cooldown-driven checks, etc.), and it scales with online-player-count x kits-with-passives, so
  # it is the cheapest lever to pull for less main-thread work without changing any ability's actual
  # behaviour. The only visible cost is passive effects (Regen, Resistance, Haste, and the like)
  # taking up to 2s to reapply after something strips them, instead of up to 1s. Set back to 20 if
  # that lag is not worth the responsiveness.
  tick-interval-ticks: 40
  # Show remaining cooldowns on the action bar.
  cooldown-action-bar: true
  # Play a quiet cue and show READY when any ability finishes cooling down.
  cooldown-ready-notifications: true
  # Which client action fires a player's primary ability is now a per-player choice, not a
  # server-wide setting -- see /power keybind and com.powersmp.kit.AbilityTrigger. Defaults to
  # sneak + right-click, same as before, but every player can change it for themselves.
  # Cooldowns longer than this are left off the action bar and only reported
  # when you try to use them -- otherwise KornFlakis's 7-day execute would
  # pin a message to his screen for a week.
  cooldown-action-bar-max-seconds: 600
  # Auto-save interval for data.yml, in seconds.
  autosave-seconds: 300

# =====================================================================
# Vanilla scoreboard teams
# =====================================================================
teams:
  # Players on the same /team are skipped by PowerSMP damage, pulls, freezes,
  # stuns, blindness, slowness and other hostile ability effects.
  protect-from-negative-abilities: true
  buff-sharing:
    enabled: true
    radius: 50.0
    # Shared copies can never out-rank level II or last longer than 15 seconds.
    # Passives refresh while the teammate stays in range, then expire naturally.
    max-amplifier: 1
    max-duration-seconds: 15.0

# ---------------------------------------------------------------------
# Server-wide, not tied to any kit: everyone is immune to all damage for
# a window after respawning. The window resets on each death rather than
# stacking.
# ---------------------------------------------------------------------
respawn-protection:
  enabled: true
  duration-seconds: 180   # 3 minutes
  # Chat message on respawn and when protection wears off.
  message: true

# ---------------------------------------------------------------------
# Kit assignment. The spec recommends hardcoding this, and the defaults
# below are compiled into KitRegistry. Anything listed here overrides or
# extends the hardcoded map, so an admin can reassign without a rebuild.
# Names are matched case-insensitively; UUIDs also work as the key.
# ---------------------------------------------------------------------
assignments:
  Mavricc: mavricc
  NorthOfNowhere: northofnowhere
  xCR1T1Cx: xcr1t1cx
  KornFlakis: kornflakis
  ItzMeTentx: itzmetentx
  domanthegamer: domanthegamer
  Sparkkkkkkkk: sparkkkkkkkk
  Night_Scar3: night_scar3
  Marb13_: marb13
  LlamaChas: llamachas
  JJlionjxi: jjlionjxi
  MonkeyMan4167: monkeyman
  TechKnightGaming: techknight
  ahriahn: voidwalker
  disasterflames: disasterflames
  FunnySounds: funnysounds
  ThePoultryMan10: poultryman
  _glueman: theghost
  crazyTNT2cool: crazytnt2cool
  I_BL0W_STUFF_UP: bites_the_dust
  IdleDeathGamble: idledeathgamble
  Ldledeathgamble: idledeathgamble
  # Phantom + Life Stealer run all the time; Lucky's reroll timer overrides both
  # with a single rolled kit for its duration, then reverts to all three.
  JustSoopTBH: phantom,lifestealer,lucky

# ---------------------------------------------------------------------
# Progression / unlock gating.
# OPEN QUESTION #2 in the spec: nobody has decided what unlocks each
# tier. Default is "everything on at once", which is the behaviour if
# unlock-all is true. Flip it to false and the kill-thresholds below
# start applying; /powersmp grant still works either way.
# ---------------------------------------------------------------------
progression:
  unlock-all: true
  # Player kills required for each gated power. Only consulted when
  # unlock-all is false. 0 = available immediately.
  # Advancement/trigger-gated powers (wither_wings, dimensional_adaptation,
  # sporic_mind_control, sporic_of_the_sea) ignore this list entirely --
  # they unlock from their own trigger.
  # Nothing goes above 10 -- these have to be reachable on an SMP.
  kill-thresholds:
    ka_chow: 0
    overdrive: 4
    spear_master: 8
    flash: 0
    power_of_the_sun: 4
    mirage: 8
    the_world: 0
    made_in_heaven: 5
    requiem: 10
    # JJlionjxi's low / mid / high tiers.
    wind_god: 0
    fat_tank: 4
    greedy_heal: 8
    # domanthegamer's low / mid / high tiers.
    blood_bound: 0
    tracking: 4
    bloodlust: 8
    # Sparkkkkkkkk's low / mid / high tiers.
    gunpowder: 0
    explosion: 4
    atom_bomb: 8
    # Night_Scar3's low / mid / high tiers.
    infernal_vitality: 0
    shadow_bomb: 4
    cutlass_master: 8
    # Marb13_'s low / mid / high tiers.
    miners_haven: 0
    ender_magic: 4
    shadow_master: 8
    # Shadows Technique: dogs at the start, utility at 4 kills, Mahoraga at 10.
    rabbit_escape: 4
    shadow_storage: 4
    mahoraga: 10
  # Announce unlocks in chat to the whole server.
  broadcast-unlocks: true

# =====================================================================
# Mavricc -- stances / mushroom affinity / mushroom hunger
# =====================================================================
mavricc:
  stances:
    # Effect durations are refreshed every tick-interval, so these only
    # need to outlast one interval. Amplifier 0 = level I.
    red:
      strength-amplifier: 1        # Strength II
      armor-points: -4.0           # "-2 bars"; 1 armour bar = 2 armour points
    blue:
      speed-amplifier: 1           # Speed II
      weakness-amplifier: 0        # Weakness I
      haste-amplifier: 1           # Haste II
      bonus-block-reach: 1.0
      bonus-entity-reach: 1.0
    green:
      resistance-amplifier: 1      # Resistance II
      slowness-amplifier: 0        # Slowness I
      knockback-resistance: 1.0    # ASSUMED (spec says "knockback resistance",
                                   # no number). 1.0 = fully immune.

  affinity:
    # Blocks that grant affinity when stood on.
    blocks: [MYCELIUM]
    # Any biome whose key contains one of these substrings grants affinity.
    biome-key-contains: [mushroom]
    # Affinity bumps every active potion amplifier by +1 and adds this
    # much extra armour penalty ("armor penalty by +1 bar").
    extra-armor-points: -2.0
    red-bonus-attack-speed: 1.0    # ASSUMED. Base player attack speed is 4.0.
    blue-hunger-loss-multiplier: 0.5   # ASSUMED ("reduced hunger loss")
    blue-extra-entity-reach: 1.0
    # Green: strip harmful effects. Effects this plugin applied itself
    # (e.g. green's own Slowness I) are never stripped.
    green-debuff-immunity: true

  mushroom-hunger:
    enabled: true
    # How the reworked nutrition is delivered.
    #
    # CONSUME_TIME (default) -> applied to the EATER when they finish eating.
    #   Nothing is written to the item, so nothing leaks: food handed to
    #   another player behaves normally for them, and every delivery route
    #   works (hoppers, dispensers, villager trades, /give) because the item
    #   never has to be seen beforehand.
    # ITEM_COMPONENT -> bakes the values into each ItemStack. Kept as an
    #   option, but the values then travel with the item to whoever holds it.
    nutrition-mode: CONSUME_TIME
    # Scope of the whole rework, and of stack-size stamping specifically.
    # Stack size is the one part that MUST live on the item -- there is no
    # per-player equivalent -- so it is still stamped in either mode.
    # OWNER_ONLY -> only Mavricc. GLOBAL -> everyone, plus hopper/dispenser
    # and item-spawn hooks for stack sizes.
    scope: OWNER_ONLY
    mushroom-foods:
      # Raw RED_MUSHROOM / BROWN_MUSHROOM are not edible in vanilla and already
      # stack to 64, so they are left out: the rework only ever raises a stack
      # limit, and only edible items get the nutrition override.
      items: [MUSHROOM_STEW]
      nutrition: 8                 # cooked beef
      saturation: 12.8             # cooked beef
      max-stack-size: 32
    suspicious-stew:
      nutrition: 6                 # golden carrot
      saturation: 14.4             # golden carrot
      max-stack-size: 32
    other-food:
      nutrition: 5                 # bread
      saturation: 6.0              # bread
      # Items never touched by the rework.
      exempt: [GOLDEN_APPLE, ENCHANTED_GOLDEN_APPLE]

  wither-wings:
    # Items that count as "holding fungi" when the Wither dies. Checked in
    # main hand, off hand and helmet slot.
    fungus-items: [RED_MUSHROOM, BROWN_MUSHROOM, CRIMSON_FUNGUS, WARPED_FUNGUS,
                   MUSHROOM_STEW, RED_MUSHROOM_BLOCK, BROWN_MUSHROOM_BLOCK, MUSHROOM_STEM]
    # A bound, unbreakable elytra is re-issued on join if it goes missing.
    grant-elytra: true
    # "one-time launch": an upward boost, once per cooldown.
    launch-power: 1.6              # ASSUMED
    launch-cooldown-seconds: 45    # ASSUMED

  dimensional-adaptation:
    # ASSUMED throughout -- the spec says "size + max-health change per
    # stance" without giving numbers. scale is an absolute value (1.0 is
    # normal); health-bonus is added to the 20.0 base.
    red:   { scale: 1.2, health-bonus: 6.0 }
    blue:  { scale: 0.8, health-bonus: 4.0 }
    green: { scale: 1.4, health-bonus: 10.0 }
    none:  { scale: 1.0, health-bonus: 0.0 }
    # Used once the stances are consolidated, since no single stance applies.
    consolidated: { scale: 1.4, health-bonus: 10.0 }

  sporic-mind-control:
    hero-amplifier: 1              # Hero of the Village II
    hero-amplifier-affinity: 3     # Hero of the Village IV

  sporic-of-the-sea:
    red-crits-per-lightning: 3
    blue-riptide-cooldown-seconds: 6
    blue-riptide-power: 2.2        # ASSUMED

  draconic-evolution:
    enabled: true
    # Picking up the dragon egg turns it into one Dragon Omelet. Eating that
    # is the one-way door: from then on all three stances run at once.
    # Any edible material works -- identity lives in the item's PDC tag, so
    # changing this does not break omelets already in circulation.
    omelet-material: PUMPKIN_PIE
    # "the perks of all of them" -- so consolidation grants the upsides only.
    # Set true to carry red's armour penalty, blue's Weakness and green's
    # Slowness across as well.
    consolidation-includes-drawbacks: false

# =====================================================================
# NorthOfNowhere -- JoJo-flavoured heavy-cooldown ults
# =====================================================================
northofnowhere:
  the-world:
    radius: 8.0                    # ASSUMED (spec suggests ~8)
    duration-seconds: 9            # exact, per spec
    cooldown-seconds: 240          # ASSUMED (spec suggests 3-5 min)
    affect-players: true
    affect-mobs: true
    # false = frozen targets stay hittable, so the time-stop is an opening
    # to attack rather than a shield. true = the spec's literal reading,
    # where a frozen target can be neither hurt nor hurt anyone.
    block-damage-to-frozen: false

  made-in-heaven:
    # NOTE: does NOT touch /tick rate -- that is a global server setting.
    # See README "Flagged mechanics". Caster gets buffed, everyone else
    # in radius gets slowed; the net feel is the same.
    duration-seconds: 20           # ASSUMED
    cooldown-seconds: 240          # ASSUMED
    radius: 12.0                   # ASSUMED
    self-speed-amplifier: 2        # Speed III
    self-haste-amplifier: 1        # Haste II
    self-bonus-attack-speed: 2.0   # ASSUMED
    self-no-fall-damage: true
    # The slow targets other PLAYERS. Set to false to catch mobs as well.
    others-players-only: true
    others-slowness-amplifier: 1   # Slowness II
    others-mining-fatigue-amplifier: 1
    # Potions cannot slow arrows, fireballs, TNT or minecarts. Everything
    # non-living in range has its velocity scaled by this every tick instead
    # -- except anything NorthOfNowhere fired himself. 1.0 disables it.
    others-velocity-multiplier: 0.35

  requiem:
    # marb approved it.
    enabled: true
    duration-seconds: 2            # per spec
    cooldown-seconds: 600          # ASSUMED (must exceed the other two)

# =====================================================================
# KornFlakis -- one execution a week
# =====================================================================
kornflakis:
  kill:
    # 7 days. Persisted to data.yml -- at this length a restart would
    # otherwise hand back a free execution.
    cooldown-seconds: 604800
    # true  -> what vanilla /kill does: straight through armour, Resistance,
    #          totems, and NorthOfNowhere's Requiem. Nothing saves the target.
    # false -> routed through the damage system instead, so a totem of
    #          undying (and Requiem) can save them. Gives it counterplay.
    bypass-protections: true
    broadcast: true

# =====================================================================
# xCR1T1Cx -- combo / momentum fighter
# =====================================================================
xcr1t1cx:
  ka-chow:
    combo-window-seconds: 3.0      # ASSUMED (spec suggests 3s)
    hits-required: 3
    wither-duration-seconds: 3
    wither-amplifier: 0
    slowness-duration-seconds: 3
    slowness-level: 3
    lightning-damage: 4.0          # 2 hearts before armour
    cooldown-seconds: 0            # Critic requested no Ka-Chow cooldown
    # Lightning is visual-only; controlled damage above prevents random splash/fire damage.

  overdrive:
    # Sprint continuously without taking damage.
    tier1-seconds: 30
    tier1-speed-amplifier: 2       # Speed III
    tier2-seconds: 60
    tier2-strength-amplifier: 1    # Strength II
    tier2-duration-seconds: 120    # "for 2 minutes"
    # RECOMMENDED INTERPRETATION (spec asks for confirmation): taking a
    # hit resets the sprint timer -- so Speed III drops -- but does not
    # strip an already-granted Strength II mid-duration.
    damage-strips-tier2: false
    # "and I have infinite saturation" -- from his form response. Part of
    # Overdrive, so it comes with that tier.
    infinite-saturation: true

  spear-master:
    # Built on vanilla Iron Spear material (Material.IRON_SPEAR) from Minecraft 1.21.11.
    # The item has the real vanilla Lunge V enchantment for jab movement. The pull + stun
    # below is Critic's additional custom effect on a successful hit.
    tiers:                         # ASSUMED deltas (spec asks for exact numbers)
      3: { pull-strength: 0.8, stun-seconds: 3.0 }
      4: { pull-strength: 1.1, stun-seconds: 4.0 }
      5: { pull-strength: 1.4, stun-seconds: 5.0 }
    # Kills with the spear needed to reach each tier. Kept reachable on an
    # SMP -- Lunge V lands at 10 kills, not a number nobody hits.
    upgrade-kills:
      4: 5
      5: 10
    # xCR1T1Cx's own form response: "stuns them for 5 seconds with a cooldown
    # of a minute". This was briefly 0 under a blanket "no nerfs" pass; the
    # Every successful spear hit lunges and stuns, as specified.
    hit-cooldown-seconds: 0
    # Player kills only; mob kills do not upgrade Lunge tiers.
    count-player-kills: true
    count-mob-kills: false

# =====================================================================
# ItzMeTentx -- water kit
# =====================================================================
itzmetentx:
  aquatic-grace:
    # Both are permanent. Water Breathing stops the air bar draining at all,
    # so it already means "never drown"; Dolphin's Grace does nothing out of
    # water, so leaving it on avoids flickering it at the waterline.
    water-breathing-amplifier: 0
    dolphins-grace-amplifier: 0
    # Belt and braces for "not drown", in case the effect is ever stripped.
    cancel-drowning-damage: true

  tidal-speed:
    # Added to the base attack speed of 4.0 while wet.
    attack-speed-bonus: 2.0        # ASSUMED
    # Standing in rain counts as being in water, per the spec.
    rain-counts: true

  trident-god:
    # Dry Riptide is driven from right-click so it works consistently in open
    # air and with a block under the crosshair. Wet Riptide remains vanilla.
    dry-riptide-power-base: 3.0
    dry-riptide-power-per-level: 1.5
    # Applies in water and open air; all launches use the same manual path.
    riptide-cooldown-seconds: 30
    # Three melee hits on the same player inside this window trigger the debuff.
    combo-window-seconds: 5
    combo-debuff-seconds: 5
    combo-attack-speed-reduction: 0.15
    # Anything caught by the spin attack is stunned. It stays hittable, so
    # this is an opening to attack rather than a shield around the target.
    hit-stun-seconds: 3
    stun-players-only: false
    # Stop the launch and stun when a dry Riptide reaches a target.
    collision-range: 0.6
    # Original Poseidon's Trident properties from JadenManGODTrident.
    spear-speed-damage-multiplier: 5.0
    lightning-enabled: true

# =====================================================================
# JJlionjxi -- low / mid / high tier kit
# =====================================================================
jjlionjxi:
  # LOW TIER
  wind-god:
    # "Infinite" wind charges. Vanilla consumes the item on throw and there
    # is no unbreakable flag for a projectile item, so the stack is topped
    # back up on the tick after each throw instead.
    stack-size: 16

  # MID TIER
  fat-tank:
    resistance-amplifier: 1        # Resistance II
    duration-seconds: 15
    cooldown-seconds: 60

  # HIGH TIER
  greedy-heal:
    instant-health-amplifier: 1    # Instant Health II
    regeneration-amplifier: 0      # Regeneration I
    regeneration-seconds: 10       # ASSUMED -- no duration was given
    absorption-amplifier: 1        # Absorption II
    absorption-seconds: 60         # ASSUMED -- no duration was given
    cooldown-seconds: 90           # ASSUMED -- no cooldown was given

# =====================================================================
# domanthegamer -- Blood Tracker / Bloodlust
# =====================================================================
domanthegamer:
  passive:
    resistance-level: 1
    regeneration-level: 1

  tracking:
    # Keeps ordinary emeralds valid for villager trades and replenishes them after use.
    minimum-emeralds: 64
    # Every other player gets zero receive range, making Locator Bar access exclusive.
    locator-range: 1024.0

  # Faithful Arc 1 progression: bleed at base, then one upgrade per player kill.
  bloodlust:
    bleed-chance: 0.15
    bleed-damage: 1.0
    # The source plugin applies two pulses per second for ten seconds.
    bleed-pulses: 20
    bleed-interval-ticks: 10
    speed-kills: 1                 # Speed II while held
    blood-sense-kills: 2
    blood-sense-range: 30.0
    blood-trail-kills: 3
    blood-trail-duration-seconds: 10
    # The trail lingers after Doman moves through an area. Enemies touching it
    # take half a heart every pulse and receive Slowness II; teammates are safe.
    blood-trail-linger-seconds: 5
    blood-trail-pulse-ticks: 10
    blood-trail-point-spacing: 0.75
    blood-trail-radius: 1.5
    blood-trail-damage: 1.0
    blood-trail-slowness-level: 2
    blood-trail-slowness-seconds: 2
    blood-trail-cooldown-seconds: 60
    strength-kills: 4              # Strength I while held
    blood-chain-kills: 5
    blood-chain-range: 20.0
    blood-chain-pull: 3.0
    blood-chain-cooldown-seconds: 30

# =====================================================================
# Sparkkkkkkkk -- The Atom
# =====================================================================
# Every number here is ASSUMED. His form gave three lines and no values.
sparkkkkkkkk:
  # LOW TIER
  gunpowder:
    bonus-per-creeper: 3

  # MID TIER
  explosion:
    power: 3.0                     # TNT is 4.0
    # Off by default: an explosion that reshapes terrain on a cooldown is a
    # griefing tool as much as a weapon. Turning it on is deliberate.
    break-blocks: false
    set-fire: false
    cooldown-seconds: 45

  # HIGH TIER
  atom-bomb:
    power: 6.0
    break-blocks: false
    set-fire: false
    range: 40.0
    cooldown-seconds: 300

# =====================================================================
# Night_Scar3 -- Infernal Vitality / Shadow Bomb / Cutlass
# =====================================================================
night_scar3:
  # LOW TIER
  infernal-vitality:
    hearts: 12                     # 24 health points total
    fire-resistance: true

  # MID TIER
  shadow-bomb:
    combo-hits: 3
    combo-window-seconds: 3.0
    duration-seconds: 5
    slowness-level: 4
    hearts: 15                     # upgrades max health to 30 points

  # HIGH TIER
  cutlass:
    hearts: 20                     # final max: 40 health points
    material: IRON_SWORD           # no native Java cutlass; custom soulbound iron sword
    sweeping-edge-level: 3

# =====================================================================
# Marb13_ -- Miner's Haven / Ender Magic / Portal and Shadow Master
# =====================================================================
marb13:
  # LOW TIER
  miners-haven:
    haste-amplifier: 1             # Haste II everywhere
    deepslate-haste-amplifier: 4   # Haste V on deepslate
    # Matched against the block name, so every deepslate variant and
    # deepslate ore counts without listing them all.
    deepslate-name-contains: DEEPSLATE
    # How far ahead to look for the block being mined.
    look-range: 6

  # MID TIER
  ender-magic:
    # Ender chest anywhere. 0 = no cooldown, as specified.
    enderchest-cooldown-seconds: 0
    # "inf pearls" -- the stack is topped back up rather than made
    # unconsumable, since vanilla always consumes a thrown pearl.
    pearl-stack-size: 16

  # HIGH TIER
  portal-and-shadow:
    portal-cooldown-seconds: 120   # ASSUMED -- none was given
    # Off by default: a portal that overwrites solid blocks is a demolition
    # tool, not a movement power. Air and replaceables only unless enabled.
    portal-replaces-solid-blocks: false
    # Creates one permanent shadow copy. The copy vanishes if its linked
    # original breaks, burns, explodes, or despawns.
    shadow-cooldown-seconds: 60

# =====================================================================
# LlamaChas -- flight / heat vision / x-ray / freeze breath / strength
# =====================================================================
# No tiers were given, so all five are on from the start.
llamachas:
  flight:
    # Creative-style flight. This is the single most anticheat-triggering
    # thing in the plugin -- NoCheatPlus WILL kick him without the exemptions
    # in server-setup/luckperms-commands.txt.
    speed: 0.1                     # 0.1 is vanilla creative flight speed

  heat-vision:
    range: 24.0                    # ASSUMED
    damage: 6.0                    # ASSUMED -- 3 hearts
    fire-ticks: 80                 # 4 seconds alight
    # Off by default: setting the world on fire on an 8s cooldown is a
    # griefing tool as much as a weapon.
    ignite-blocks: false
    cooldown-seconds: 8            # ASSUMED

  xray:
    # Real x-ray is impossible -- the client decides what it renders. This
    # instead sends fake air blocks to LlamaChas alone, so ores stand out.
    # The world itself is never changed and nobody else sees anything.
    #
    # Radius is cubed, so it grows fast: 8 is ~4,900 blocks, 12 is ~15,600.
    # Raising it much past 8 means a noticeable packet burst on each use.
    radius: 8
    duration-seconds: 12           # ASSUMED
    cooldown-seconds: 60           # ASSUMED
    # Only natural filler is hidden, so this can never blank out a build.
    hide-blocks: [STONE, DEEPSLATE, DIRT, GRAVEL, ANDESITE, DIORITE, GRANITE, TUFF, NETHERRACK]

  freeze-breath:
    range: 10.0                    # ASSUMED
    cone-degrees: 40.0             # ASSUMED -- half-angle of the cone
    freeze-ticks: 200              # powder-snow freezing, 10 seconds
    slowness-amplifier: 2          # Slowness III
    cooldown-seconds: 20           # ASSUMED

  super-strength:
    amplifier: 1                   # Strength II
    # Things he hits travel further. 0 disables.
    bonus-knockback: 0.6           # ASSUMED

# =====================================================================
# MonkeyMan4167 -- "Light" progression kit
# =====================================================================
monkeyman:
  flash:
    speed-amplifier: 0             # permanent Speed I
    # ON_HIT = blind whoever you hit. ON_ACTIVATE = blind everyone in
    # radius when you fire the ability. The spec asks which; ON_HIT is
    # the default reading.
    mode: ON_HIT                   # ASSUMED
    blind-duration-seconds: 3      # ASSUMED
    blind-internal-cooldown-seconds: 0   # 0 = every hit blinds
    activate-radius: 6.0
    activate-cooldown-seconds: 30

  power-of-the-sun:
    speed-amplifier: 0             # Speed I
    strength-amplifier: 1          # Strength II (the higher of the spec's "I or II")
    # Only counts as daytime when the sky is actually visible.
    require-sky-access: false

  mirage:
    # Clone backend.
    #   PROTOCOLLIB  -> real player entities with MonkeyMan4167's actual skin.
    #                   They walk, and swinging at one pops it. Requires the
    #                   ProtocolLib plugin on the server.
    #   ARMOR_STAND  -> zero-dependency fallback: invisible armour stands in
    #                   a copy of the owner's gear under a player head.
    # PROTOCOLLIB degrades to ARMOR_STAND on its own if ProtocolLib is
    # missing, or if a game update moves a packet field it relies on.
    provider: PROTOCOLLIB
    clone-count: 3                 # ASSUMED
    duration-seconds: 12           # ASSUMED
    cooldown-seconds: 60           # ASSUMED
    spawn-radius: 3.0
    # Clones drift a little so they are not obviously statues.
    drift: true
    drift-blocks-per-second: 0.6
    # Dress decoys in a copy of the owner's armour and held item. An invisible
    # stand wearing visible armour under a player head reads as a player
    # silhouette at range. Drop chances are forced to zero, so breaking a
    # clone cannot duplicate the owner's gear.
    wear-owner-armor: true
    # Buffs while Mirage is active.
    speed-amplifier: 1             # Speed II
    strength-amplifier: 1          # Strength II (the higher of the spec's "I or II")
    fire-resistance: true

# =====================================================================
# TechKnightGaming -- gadget combat / Restock
# =====================================================================
techknight:
  # Passive signature weapon. Only player kills count because the shared
  # PvP kill counter is used; mobs cannot advance Titan Protocol.
  titan-protocol:
    tier-2-player-kills: 2
    tier-3-player-kills: 10
    tier-1-damage-bonus: 2.0
    tier-2-damage-bonus: 5.0
    tier-3-damage-bonus: 9.0
    # Tier I (0 kills): Sharpness III and +2 damage over its Netherite Sword base.
    # Tier II (2 kills): Sharpness V, Strength II, Speed I, Fire Resistance I.
    # Tier III (10 kills): Sharpness VIII, Strength II, Speed II,
    # Fire Resistance I and Resistance II.
    # Buffs refresh while the tagged blade is anywhere in the player inventory.

  restock:
    # 5 hours. Persisted to data.yml, so a restart does not refund it.
    cooldown-seconds: 18000
    # How many things the restock kit holds. TechKnightGaming picks what goes
    # in them himself with /power loadout; his choice is saved per-player and
    # always wins over the defaults below. Max 27.
    slots: 7
    # Only used until he sets his own loadout. Format: MATERIAL:amount
    default-items:
      - ENDER_PEARL:16
      - GOLDEN_APPLE:8
      - COOKED_BEEF:32
      - OBSIDIAN:16
      - COBBLESTONE:64
      - ARROW:64
      - WATER_BUCKET:1

  xp-bottles:
    # No cooldown, as specified.
    fill-inventory: true
    max-stacks: 36

  # Passive, no cooldown, no toggle. Applies to blocked melee hits.
  shield-break:
    enabled: true
    chance: 0.5                    # half of blocked hits ignore the shield entirely

  grapple-shot:
    pull-power: 1.35
    pulse-ticks: 30
    range: 100.0
    cooldown-seconds: 0

  # Original Altar Arc 1 Bone Blade actives, layered under Titan Protocol.
  bone-blade:
    skeletal-leap-cooldown-seconds: 15
    skeletal-leap-power: 2.5
    skeletal-leap-speed-seconds: 6
    bone-cage-cooldown-seconds: 20
    bone-cage-projectile-speed: 4.0
    bone-cage-stun-seconds: 10

# =====================================================================
# Voidwalker (ahriahn) -- Shadow Step / Grasp of Eylis / Illusory Realm
# =====================================================================
voidwalker:
  shadow-step:
    # "Once within 6 seconds" -- landing a hit arms this window; a deliberate re-activation (not
    # every automatic swing) spends it to blink behind the same target.
    window-seconds: 6.0
    behind-distance: 1.2             # ASSUMED -- how far behind the target you land
    blindness-ticks: 40              # 2 seconds, as specified
    slowness-ticks: 40               # 2 seconds, as specified
    slowness-amplifier: 3            # Slowness IV, as specified
    # 0 = no timer beyond the on-hit window itself. Set above 0 to also rate-limit reuse.
    reuse-cooldown-seconds: 0        # ASSUMED

  grasp-of-eylis:
    radius: 10.0
    duration-ticks: 200              # 10 seconds, as specified
    slowness-amplifier: 2            # Slowness III
    mining-fatigue-amplifier: 2      # Mining Fatigue III
    self-speed-amplifier: 2          # Speed III
    self-haste-amplifier: 1          # Haste II
    self-buff-ticks: 100             # 5 seconds, as specified
    cooldown-seconds: 90

  illusory-realm:
    # "300s cd (only starts counting when the domain ends)" -- see illusory-realm: below for the
    # arena's own duration and rules; this is only when the cooldown itself begins ticking.
    cooldown-seconds: 300

# =====================================================================
# Illusory Realm -- the arena world and the rules that apply inside it.
# Shared infrastructure, not owned by any one kit, in case a future kit
# also wants to open a domain.
# =====================================================================
illusory-realm:
  # World the arena lives in. Created on first use (or shortly after startup if
  # pre-generate is true) with every generation stage turned off -- pure void
  # until the arena box is stamped in.
  world-name: powersmp_illusory_realm
  pre-generate: true

  duration-seconds: 60               # "60 seconds or until only 1 player is left alive"
  # "A slight delay (players affected gain blindness for 1s)" before the teleport.
  entry-delay-ticks: 20
  entry-blindness-ticks: 20
  # "Teleport you and players within 20 blocks each direction" -- gathered at activation time.
  gather-radius: 20.0
  # Below this many participants, "last one standing" cannot trigger (there is nobody to be last
  # against), so the domain just runs its full duration.
  min-participants: 2
  # "For each player (not including the user) caught, the user gains 2 max hearts for the duration."
  bonus-hearts-per-victim: 2.0

  arena:
    # "A black box 20x20 with a little bit of terrain, with a roof 10 blocks high."
    size: 20
    height: 10
    floor-y: 64
    # How far apart concurrent domains sit in the shared void world, so two fights never overlap.
    slot-spacing: 256
    shell-block: BLACK_CONCRETE
    interior-light: true             # hidden light sources so the sealed box is not unplayable
    terrain-clusters: 10             # ASSUMED -- "a little bit of terrain"
    floating-platforms: 3            # ASSUMED
    terrain-blocks: [BLACKSTONE, DEEPSLATE, BASALT, OBSIDIAN]

  rules:
    disable-powers: true             # "All powers are disabled"
    disable-totems: true             # "Totems do not work"
    disable-enderpearls: true        # "Enderpearls do not work"
    disable-enderchests: true        # "Enderchests cannot be placed"
    disable-chorus-fruit: true       # "Chorus fruit are disabled"
    unbreakable-box: true            # "The box cannot be broken"
    # If true, any potion effect not in granted-effects below is blocked outright rather than just
    # capped. Off by default -- harmless effects (Night Vision, etc.) are left alone; only the four
    # effects below are capped to the domain's own amplifier.
    block-all-other-effects: false

  # "They are given speed 1, fire res, strength 1, and weaving all for 60 seconds. They are unable
  # to get effects higher than this for the domain." Amplifiers are 0-indexed (0 = level I).
  granted-effects:
    speed: 0
    fire_resistance: 0
    strength: 0
    weaving: 0

# =====================================================================
# disasterflames -- Shadows Technique
# =====================================================================
disasterflames:
  divine-dogs:
    cooldown-seconds: 120
  rabbit-escape:
    duration-seconds: 15
    cooldown-seconds: 60
  mahoraga:
    summoning-seconds: 5
    duration-seconds: 120
    cooldown-seconds: 600
    warning-radius: 48

# =====================================================================
# FunnySounds -- Village Charmer
# =====================================================================
funnysounds:
  range: 8.0
  cooldown-seconds: 60

# =====================================================================
# ThePoultryMan10 -- Damage Adaptation
# =====================================================================
poultryman:
  damage-per-armor: 1000.0
  max-bonus-armor: 10

# =====================================================================
# The Ghost (_glueman) -- Possession / Spectral Body / Astral Form
# =====================================================================
theghost:
  possession:
    range: 20.0                    # ASSUMED -- how far away a mob can be to possess
    # Sneak + swap-hands while possessing makes the mob take a swing -- a
    # spectator cannot throw a real attack, so this is faked by hand.
    attack-range: 3.0               # ASSUMED
    attack-damage: 4.0              # ASSUMED -- 2 hearts
    attack-cooldown-seconds: 1.0    # ASSUMED -- roughly a normal attack speed

  spectral-body:
    # Holding sneak explicitly engages phase. Sneak alone descends; sneak +
    # WASD phases horizontally. A 4-block fake-air bubble plus temporary
    # Night Vision keeps the underground route visible.
    scan-radius: 4
    # These stay solid even to him. Names must match a real Material.
    impassable-blocks: [OBSIDIAN, BEDROCK, REINFORCED_DEEPSLATE]

# =====================================================================
# Phantom -- permanent Speed, an invisibility toggle, and a full vanish
# =====================================================================
phantom:
  speed-amplifier: 1                  # Speed II
  # Full Vanish: hides the whole model (armour included), not just the
  # plain Invisibility effect Phantom Cloak uses.
  vanish-seconds: 30
  vanish-cooldown-seconds: 300.0      # 5 minutes

# =====================================================================
# Lucky -- randomly becomes another kit for a while, then rerolls
# =====================================================================
lucky:
  # How long each roll lasts before automatically rerolling.
  roll-minutes: 20

# =====================================================================
# Life Stealer -- on-hit lifesteal, marks targets, doubles hostile drops
# =====================================================================
lifestealer:
  lifesteal:
    # Every Nth hit in a row on the same target (a 3s window, same as
    # Ka-Chow's combo) steals a random amount of health instead of every
    # single hit -- "steal a small amount of health with 5 hits".
    combo-hits: 5
    min-hearts: 1
    max-hearts: 3
  marked-prey:
    # Every hit, not gated by the combo above -- outs the target's
    # position for a few seconds.
    glow-seconds: 5
  double-drops:
    multiplier: 2

# =====================================================================
# I_BL0W_STUFF_UP -- Bites the Dust
# =====================================================================
bites-the-dust:
  sticky-tnt:
    max-stock: 5
    recharge-seconds: 6
    empty-refill-seconds: 30
    fuse-seconds: 1
    radius: 7
    damage: 20
  stab-shot:
    range: 60
    radius: 5
    damage: 24
    cooldown-seconds: 30
  nuke-shot:
    radius: 12
    damage: 36
    cooldown-seconds: 45

# =====================================================================
# crazyTNT2cool -- The Honored One / complete Limitless kit
# =====================================================================
# Intentionally overtuned: the request was to give him the full Gojo power set.
crazytnt2cool:
  six-eyes:
    speed-amplifier: 1             # Speed II
    haste-amplifier: 1             # Haste II
    regeneration-amplifier: 0      # Regeneration I

  infinity:
    # Infinity blocks all damage except the void. Melee attackers are also
    # pushed back, and projectiles disappear before reaching the owner.
    repel-power: 1.2

  blue:
    range: 32.0
    radius: 8.0
    pull-power: 1.8
    damage: 8.0                    # 4 hearts before armour
    cooldown-seconds: 12

  red:
    range: 28.0
    half-angle-degrees: 35.0
    damage: 12.0                   # 6 hearts before armour
    knockback: 2.4
    cooldown-seconds: 18

  hollow-purple:
    range: 100.0
    radius: 4.0
    damage: 60.0                   # 30 hearts before armour; passes through walls
    knockback: 3.0
    cooldown-seconds: 90

  warp:
    range: 48.0
    cooldown-seconds: 4

  reverse-technique:
    # Full heal, debuff cleanse, fire/freeze cleanse, and 4 absorption hearts.
    cooldown-seconds: 45

  unlimited-void:
    radius: 24.0
    duration-seconds: 12
    damage: 4.0                    # sure-hit overload every second
    cooldown-seconds: 180

# =====================================================================
# Ldledeathgamble -- Idle Death Gamble
# =====================================================================
idledeathgamble:
  base-win-chance-percent: 14
  post-win-reset-percent: 15
  failure-increase-percent: 14     # Intentionally uncapped
  fever-chance-percent: 50
  # Failed rolls use the normal 35s cooldown.
  cooldown-seconds: 35
  # Starts after the 4m 11s Jackpot buffs expire.
  jackpot-cooldown-seconds: 120
  # Informational: Jackpot is enforced in code at exactly 251s (4m 11s), so an
  # older server-side kits.yml cannot accidentally shorten it after an update.
  buff-seconds: 251
  strength-amplifier: 2           # Strength III
  regeneration-amplifier: 4       # Regeneration V
  speed-amplifier: 2              # Speed III

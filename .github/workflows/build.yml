name: Build

# Builds the plugin jar on every push and publishes it two ways:
#   1. a "dev" prerelease, which does NOT count against the Actions artifact
#      storage quota -- this is the reliable download link
#   2. a run artifact, which is convenient but is the first thing to break when
#      the account's artifact storage fills up, so it is best-effort only
#
# This is also where the code meets the real Paper and ProtocolLib APIs; the
# environment it was written in could reach neither repository.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build jar
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B -ntp clean package

      - name: Show the jar
        run: ls -lh target/*.jar

      # Best-effort. Artifact storage is a hard account-wide quota, and hitting
      # it must not fail a build that actually compiled.
      - name: Upload jar as run artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: powersmp-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

      # The dependable route: release assets are stored separately from Actions
      # artifacts, so this keeps working when the artifact quota is full.
      - name: Publish to the rolling dev release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Automatic build of \`${GITHUB_SHA:0:7}\` on \`${GITHUB_REF_NAME}\`.
          Download \`powersmp-0.1.0.jar\` below and drop it in your server's \`plugins/\` folder.
          See INSTALL.md for the rest of the setup."
          if gh release view dev >/dev/null 2>&1; then
            gh release upload dev target/*.jar --clobber
            gh release edit dev --notes "$NOTES"
          else
            gh release create dev target/*.jar \
              --title "Latest dev build" \
              --notes "$NOTES" \
              --prerelease
          fi
